services:
  demo:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_MODE: demo
      OTEL_CAPTURE_CONTENT: "false"
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  api:
    profiles: ["live"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports: ["127.0.0.1:8002:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: live
      DATABASE_URL: postgresql://genai:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/telecom_genai
      EMBEDDING_REDIS_URL: redis://redis:6379/0
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_CAPTURE_CONTENT: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    profiles: ["live", "integration"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telecom_genai
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai -d telecom_genai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["live", "integration"]
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    profiles: ["live", "tracing"]
    image: jaegertracing/all-in-one:1.76.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]

volumes:
  postgres_data:
