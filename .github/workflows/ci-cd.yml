name: Release verification
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src --ignore-missing-imports
      - name: Audit delivered dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt > /dev/null
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - run: uv run pytest -q --cov=src --cov-report=xml
      - name: Golden retrieval gate
        run: uv run python -m src.evaluation.cli --output /tmp/evaluation.json --compare-to reports/evaluation/baseline.json
      - name: Build Python distributions
        run: uv build
      - name: Start integration dependencies
        run: docker compose --profile integration up -d --wait postgres redis
      - name: Exercise real PostgreSQL publication and retrieval
        env:
          RUN_INTEGRATION: '1'
        run: uv run pytest tests/test_release.py -q
      - name: Build and start demo container
        run: docker compose up -d --build --wait demo
      - name: Verify packaged demo
        run: uv run python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: telecom-genai-release
          path: |
            dist/
            coverage.xml
            /tmp/evaluation.json
      - name: Collect container diagnostics
        if: failure()
        run: docker compose --profile integration logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose --profile integration down
