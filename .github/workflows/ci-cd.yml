name: Release verification
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src --ignore-missing-imports
      - name: Audit delivered dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt > /dev/null
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - run: uv run pytest -q --cov=src --cov-report=xml
      - name: Golden retrieval gate
        run: uv run python -m src.evaluation.cli --output /tmp/evaluation.json --compare-to reports/evaluation/baseline.json
      - name: Build Python distributions
        run: uv build
      - name: Start integration dependencies
        run: docker compose --profile integration up -d --wait postgres redis
      - name: Exercise real PostgreSQL publication and retrieval
        env:
          RUN_INTEGRATION: '1'
        run: uv run pytest tests/test_release.py tests/test_deployment.py -q
      - name: Build and start demo container
        run: docker compose up -d --build --wait demo
      - name: Verify packaged demo
        run: uv run python scripts/verify_release.py
      - name: Accept production stack over verified TLS
        run: uv run python scripts/accept_deployment.py
      - name: Report container advisories and reject fixable high/critical findings
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.release-check:/reports" aquasec/trivy:0.76.2 image --quiet --scanners vuln --severity HIGH,CRITICAL --format json --output /reports/image-audit.json genaitelco-demo:latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 genaitelco-demo:latest
      - name: Validate Azure infrastructure without credentials
        run: |
          docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.9.8 fmt -check
          docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.9.8 init -backend=false -lockfile=readonly
          docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.9.8 validate
          docker run --rm -v "$PWD/infrastructure/terraform:/work" -w /work hashicorp/terraform:1.9.8 test
      - name: Validate alert rules
        run: docker run --rm -v "$PWD/infrastructure/prometheus:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /rules/alerts.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: telecom-genai-release
          include-hidden-files: true
          path: |
            dist/
            coverage.xml
            /tmp/evaluation.json
            .release-check/deployment-acceptance.json
            .release-check/image-audit.json
      - name: Collect container diagnostics
        if: failure()
        run: docker compose --profile integration logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose --profile integration down
