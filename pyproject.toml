[project]
name = "telecom-genai-platform"
version = "1.2.0"
description = "Enterprise GenAI integration platform for telecom automation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marius Miclau", email = "marius.miclau@gmail.com"}]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "langchain-text-splitters>=0.3.0",
    "openai>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "tqdm>=4.66.0",
    "python-multipart>=0.0.6",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
legacy-chroma = ["chromadb==1.5.9"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
follow_imports = "skip"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"share/telecom-genai/datasets/tickets-v2.0-ticket-aware-chunking" = ["datasets/tickets-v2.0-ticket-aware-chunking/tickets.jsonl", "datasets/tickets-v2.0-ticket-aware-chunking/manifest.json"]
